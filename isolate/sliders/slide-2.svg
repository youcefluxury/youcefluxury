<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Hoodie noir heavy avec lettrage graffiti blanc">
  <defs>
    <linearGradient id="s2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a38" />
      <stop offset="0.5" stop-color="#1d1d1c" />
      <stop offset="1" stop-color="#080808" />
    </linearGradient>
    <linearGradient id="s2cloth" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#232322" />
      <stop offset="0.5" stop-color="#0c0c0c" />
      <stop offset="1" stop-color="#2a2a29" />
    </linearGradient>
    <filter id="s2soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
    <filter id="s2drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#s2bg)" />
  <ellipse cx="1240" cy="130" rx="470" ry="300" fill="#6d6b66" opacity="0.3" filter="url(#s2soft)" />
  <ellipse cx="280" cy="790" rx="420" ry="300" fill="#000000" opacity="0.45" filter="url(#s2soft)" />

  <g filter="url(#s2drop)">
    <!-- sleeves -->
    <path d="M470 300 L200 480 L300 640 L560 470 Z" fill="url(#s2cloth)" />
    <path d="M1130 300 L1400 480 L1300 640 L1040 470 Z" fill="url(#s2cloth)" />
    <!-- body -->
    <path d="M470 280 Q800 120 1130 280 L1190 420 L1190 900 L410 900 L410 420 Z" fill="url(#s2cloth)" />
    <!-- hood -->
    <path d="M600 280 Q800 90 1000 280 Q930 400 800 420 Q670 400 600 280 Z" fill="#111111" />
    <path d="M646 286 Q800 140 954 286" fill="none" stroke="#4b4b49" stroke-width="5" opacity="0.7" />
    <path d="M760 400 L742 530 M840 400 L858 530" stroke="#e8e6e2" stroke-width="7" opacity="0.85" stroke-linecap="round" />
    <circle cx="742" cy="536" r="9" fill="#e8e6e2" opacity="0.85" />
    <circle cx="858" cy="536" r="9" fill="#e8e6e2" opacity="0.85" />
    <!-- kangaroo pockets -->
    <path d="M540 720 L700 792 L700 900 M1060 720 L900 792 L900 900" fill="none" stroke="#000000" stroke-width="6" opacity="0.55" />
    <path d="M410 420 L560 470" fill="none" stroke="#000000" stroke-width="5" opacity="0.5" />
    <path d="M1190 420 L1040 470" fill="none" stroke="#000000" stroke-width="5" opacity="0.5" />
  </g>

  <!-- Graffiti print -->
  <g transform="rotate(-5 800 620)" fill="none" stroke="#f7f6f3" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="64" opacity="0.95">
      <path d="M470 520 V840" />
      <path d="M470 680 H620" />
      <path d="M620 520 V840" />
      <path d="M690 840 L790 512 L890 840" />
      <path d="M880 840 V560 L1010 840 V560" />
    </g>
    <path d="M726 748 H856" stroke-width="46" opacity="0.92" />
    <path d="M1060 840 C1160 640 1200 520 1330 512" stroke-width="48" opacity="0.9" />
    <path d="M300 470 C520 420 720 452 900 430" stroke-width="24" opacity="0.7" />
    <g stroke-width="22" opacity="0.8">
      <path d="M1180 620 L1120 820" />
      <path d="M420 880 L520 872" />
    </g>
  </g>

  <defs>
    <radialGradient id="s2vig" cx="50%" cy="48%" r="72%">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.55" />
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#s2vig)" />
</svg>
