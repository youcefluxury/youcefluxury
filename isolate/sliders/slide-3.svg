    </filter>
    <filter id="s3drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#s3bg)" />
  <ellipse cx="800" cy="360" rx="620" ry="420" fill="#8f8d88" opacity="0.22" filter="url(#s3soft)" />
  <ellipse cx="800" cy="880" rx="560" ry="110" fill="#000000" opacity="0.5" filter="url(#s3soft)" />

  <g filter="url(#s3drop)">
    <path d="M320 250 L480 150 Q800 60 1120 150 L1280 250 L1430 520 L1220 600 L1170 470 L1170 900 L430 900 L430 470 L380 600 L170 520 Z" fill="url(#s3cloth)" />
    <path d="M480 150 Q800 60 1120 150" fill="none" stroke="#b9b7b2" stroke-width="5" />
    <path d="M640 118 Q800 80 960 118 Q930 248 800 266 Q670 248 640 118 Z" fill="#dcdad5" />
    <path d="M648 126 Q800 94 952 126" fill="none" stroke="#a9a7a2" stroke-width="4" />
    <path d="M430 470 L380 600 L170 520" fill="none" stroke="#a9a7a2" stroke-width="4" />
    <path d="M1170 470 L1220 600 L1430 520" fill="none" stroke="#a9a7a2" stroke-width="4" />
