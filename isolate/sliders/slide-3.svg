<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="T-shirt blanc avec lettrage graffiti noir">
  <defs>
    <linearGradient id="s3bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2e2e2c" />
      <stop offset="0.55" stop-color="#141413" />
      <stop offset="1" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="s3cloth" x1="0.15" y1="0" x2="0.85" y2="1">
