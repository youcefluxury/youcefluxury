  <g transform="rotate(6 800 520)" fill="none" stroke="#0a0a0a" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="64" opacity="0.95">
      <path d="M490 330 V690" />
      <path d="M490 510 H640" />
