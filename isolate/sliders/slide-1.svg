<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="T-shirt oversize noir avec lettrage graffiti blanc">
  <defs>
    <radialGradient id="s1bg" cx="46%" cy="42%" r="78%">
      <stop offset="0" stop-color="#c3c1bd" />
      <stop offset="0.5" stop-color="#8b8985" />
      <stop offset="1" stop-color="#25241f" />
    </radialGradient>
    <linearGradient id="s1cloth" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#20201f" />
      <stop offset="0.45" stop-color="#0a0a0a" />
      <stop offset="1" stop-color="#2c2c2b" />
    </linearGradient>
    <filter id="s1soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <filter id="s1drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#s1bg)" />
  <ellipse cx="330" cy="90" rx="430" ry="300" fill="#e3e1dd" opacity="0.34" filter="url(#s1soft)" />
  <ellipse cx="1330" cy="820" rx="460" ry="320" fill="#15140f" opacity="0.4" filter="url(#s1soft)" />
  <ellipse cx="800" cy="880" rx="560" ry="110" fill="#100f0d" opacity="0.4" filter="url(#s1soft)" />

  <!-- Oversize tee, cropped by the frame like a close-up editorial shot -->
  <g filter="url(#s1drop)">
    <path d="M300 250 L470 150 Q800 55 1130 150 L1300 250 L1450 520 L1235 600 L1185 470 L1185 900 L415 900 L415 470 L365 600 L150 520 Z" fill="url(#s1cloth)" />
    <path d="M470 150 Q800 55 1130 150" fill="none" stroke="#3d3d3c" stroke-width="5" opacity="0.7" />
    <path d="M640 118 Q800 82 960 118 Q930 250 800 268 Q670 250 640 118 Z" fill="#0b0b0b" />
    <path d="M648 126 Q800 96 952 126" fill="none" stroke="#4a4a48" stroke-width="4" opacity="0.65" />
    <path d="M415 470 L365 600 L150 520" fill="none" stroke="#000000" stroke-width="4" opacity="0.5" />
    <path d="M1185 470 L1235 600 L1450 520" fill="none" stroke="#000000" stroke-width="4" opacity="0.5" />
    <path d="M415 830 H1185" stroke="#ffffff" stroke-opacity="0.06" stroke-width="6" />
  </g>

  <!-- Fabric folds -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-linecap="round">
    <path d="M520 620 C640 700 720 760 760 880" stroke-width="8" />
    <path d="M1080 600 C980 700 940 780 930 880" stroke-width="7" />
    <path d="M470 380 C520 520 500 700 470 860" stroke-width="6" />
  </g>

  <!-- Graffiti print -->
  <g transform="rotate(-7 800 520)" fill="none" stroke="#f7f6f3" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="66" opacity="0.97">
      <path d="M490 330 V690" />
      <path d="M490 510 H640" />
      <path d="M640 330 V690" />
      <path d="M730 690 L830 330 L930 690" />
    </g>
    <path d="M778 582 H900" stroke-width="46" opacity="0.95" />
    <g stroke-width="50" opacity="0.93">
      <path d="M1000 690 C1060 520 1110 380 1170 360" />
      <path d="M1010 430 C1090 480 1160 520 1220 540" />
    </g>
    <path d="M450 800 C640 720 880 860 1140 770" stroke-width="36" opacity="0.9" />
    <path d="M600 280 C800 236 980 262 1150 306" stroke-width="24" opacity="0.72" />
    <g stroke-width="24" opacity="0.85">
      <path d="M470 470 L530 400" />
      <path d="M500 790 L580 700" />
      <path d="M880 830 L960 862" />
    </g>
  </g>

  <rect width="1600" height="900" fill="url(#s1vignette)" />
  <defs>
    <radialGradient id="s1vignette" cx="50%" cy="48%" r="72%">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.5" />
    </radialGradient>
  </defs>
</svg>
